plugins { id "com.android.application" }

android {
    namespace "com.vintedlister.app"
    compileSdk 34
    defaultConfig {
        applicationId "com.vintedlister.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1-prototype"
        buildConfigField "String", "APP_URL", "\"https://vinted-measurements-test.onrender.com/\""
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
