<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F7">
  <title>Sign in · Vinted Lister</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='studio.css') }}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100dvh; display: flex; flex-direction: column; padding: calc(48px + env(safe-area-inset-top)) 24px 32px; max-width: 440px; margin: 0 auto; }
    .si-logo { width: 56px; height: 56px; border-radius: 16px; margin-bottom: 28px; }
    .si-form { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
    .si-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: var(--sn-muted); }
    .si-form input { height: 54px; border-radius: 16px; border: 1px solid var(--sn-line); background: var(--sn-card); padding: 0 16px; font: inherit; font-size: 17px; font-weight: 600; color: var(--sn-text); }
    .si-form input:focus { outline: 2px solid var(--sn-text); outline-offset: 1px; }
    .si-form button { margin-top: 8px; height: 58px; border: 0; border-radius: 999px; background: var(--sn-pop); color: var(--sn-text); font: inherit; font-size: 17px; font-weight: 800; }
    .si-error { background: #FFEDEC; color: #B3261E; border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 700; }
    .si-foot { margin-top: auto; padding-top: 24px; font-size: 13px; color: var(--sn-muted); text-align: center; }
    .si-foot a { color: inherit; }
  </style>
</head>
<body>
  <img class="si-logo" src="{{ url_for('static', filename='brand-mark.svg') }}" alt="">
  <h1 class="sn-title">Welcome<br><span>back<i>.</i></span></h1>
  <form class="si-form" method="post">
    {% if error %}<div class="si-error" role="alert">{{ error }}</div>{% endif %}
    <label>Username<input name="username" autocomplete="username" autocapitalize="none" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="si-foot">Stays signed in for 30 days · <a href="/privacy">Privacy</a></p>
</body>
</html>
