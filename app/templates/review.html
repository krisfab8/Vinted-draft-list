{% extends "base.html" %}
{% block title %}Review — {{ listing.brand or "Item" }} {{ listing.item_type or "" }}{% endblock %}

{% block head %}
<style>
  /* ── Back nav ── */
  .review-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
    color: var(--gray-7);
    text-decoration: none;
    margin-bottom: 18px;
    -webkit-tap-highlight-color: transparent;
  }
  .review-back:hover { color: var(--black); }

  /* ── Warning bar ── */
  .warnings-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 18px;
  }

  .warn-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    border-radius: var(--r-pill);
    font-size: 12px;
    font-weight: 600;
    background: var(--gold-bg);
    color: #b86a00;
    border: 1px solid rgba(184,106,0,0.15);
  }

  .warn-chip.error {
    background: var(--error-bg);
    color: var(--error);
    border-color: rgba(255,59,48,0.15);
  }

  /* ── Graphic/plain conflict banner ── */
  .conflict-banner {
    background: #fff8e6;
    border: 1.5px solid #f5c842;
    border-radius: var(--r-lg);
    padding: 14px 16px;
    margin-bottom: 14px;
    font-size: 14px;
    color: #7a5800;
    line-height: 1.5;
  }
  .conflict-banner strong { font-weight: 700; }
  .conflict-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .conflict-btn {
    font-size: 13px;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: var(--r-sm);
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .conflict-btn.yes {
    background: var(--brand);
    color: #fff;
  }
  .conflict-btn.no {
    background: var(--gray-1);
    color: var(--gray-9);
  }

  /* ── Section cards ── */
  .review-section {
    background: var(--white);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    margin-bottom: 14px;
    overflow: hidden;
  }

  .review-section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--gray-5);
    padding: 14px 16px 0;
  }

  /* ── Field rows ── */
  .field-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 11px 16px;
    border-bottom: 1px solid var(--gray-1);
    gap: 8px;
  }

  .field-row:last-child { border-bottom: none; }

  .field-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--gray-5);
    min-width: 90px;
    flex-shrink: 0;
    padding-top: 2px;
  }

  .field-value {
    flex: 1;
    font-size: 14px;
    color: var(--black);
    word-break: break-word;
    line-height: 1.45;
  }

  .field-value.description {
    font-size: 13px;
    color: var(--gray-9);
    white-space: pre-wrap;
    line-height: 1.6;
  }

  .field-edit-wrap {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }

  /* Inline editable inputs */
  .field-input {
    flex: 1;
    font-size: 14px;
    font-family: inherit;
    color: var(--black);
    border: 1.5px solid var(--gray-2);
    border-radius: var(--r-sm);
    padding: 6px 10px;
    background: var(--white);
    min-width: 0;
    transition: border-color 150ms ease;
  }

  .field-input:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-glow);
  }

  .btn-save-field {
    font-size: 12px;
    font-weight: 600;
    color: var(--brand-dark);
    background: var(--brand-pale);
    border: none;
    border-radius: var(--r-sm);
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 150ms ease;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-save-field:hover { background: #d6f4f5; }
  .btn-save-field.saved { color: var(--success-dark); background: var(--success-bg); }

  /* ── Confidence badges ── */
  .conf-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: var(--r-pill);
    margin-left: 6px;
    vertical-align: middle;
  }

  .conf-high    { background: var(--success-bg); color: var(--success-dark); }
  .conf-medium  { background: var(--gold-bg);    color: #b86a00; }
  .conf-low     { background: var(--error-bg);   color: var(--error); }

  /* ── Materials chips ── */
  .mat-chips { display: flex; flex-wrap: wrap; gap: 5px; }

  .mat-chip {
    background: var(--brand-pale);
    color: var(--brand-dark);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: var(--r-pill);
  }

  /* ── Photos strip ── */
  .photos-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 14px 16px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .photos-strip::-webkit-scrollbar { display: none; }

  .photo-thumb {
    flex-shrink: 0;
    width: 80px;
    height: 107px;
    border-radius: var(--r-md);
    overflow: hidden;
    background: var(--gray-1);
  }

  .photo-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-label {
    font-size: 9px;
    font-weight: 600;
    text-align: center;
    color: var(--gray-5);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  /* ── Error taxonomy ── */
  .error-tag-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 16px;
  }

  .error-tag-btn {
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    padding: 8px 16px;
    border-radius: var(--r-pill);
    border: 1.5px solid var(--gray-2);
    background: var(--white);
    color: var(--gray-7);
    cursor: pointer;
    transition: all 150ms ease;
    -webkit-tap-highlight-color: transparent;
  }

  .error-tag-btn.active {
    background: var(--error-bg);
    border-color: var(--error);
    color: var(--error);
  }

  .error-tag-btn:hover:not(.active) { background: var(--gray-1); }

  /* ── Draft error banner ── */
  .draft-error-banner {
    background: var(--error-bg);
    border: 1.5px solid rgba(255,59,48,0.25);
    border-radius: var(--r-lg);
    padding: 13px 16px;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--error);
    line-height: 1.5;
  }
  .draft-error-banner strong { font-weight: 700; display: block; margin-bottom: 3px; }

  /* ── eBay comps box ── */
  .ebay-comps-box {
    background: var(--white);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    margin-bottom: 14px;
    overflow: hidden;
  }
  .ebay-comps-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 0;
  }
  .ebay-comps-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--gray-5);
  }
  .btn-fetch-comps {
    font-size: 12px;
    font-weight: 600;
    color: var(--brand-dark);
    background: var(--brand-pale);
    border: none;
    border-radius: var(--r-sm);
    padding: 5px 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 150ms ease;
  }
  .btn-fetch-comps:hover { background: #d6f4f5; }
  .btn-fetch-comps:disabled { opacity: 0.5; cursor: default; }
  .ebay-comps-body {
    padding: 10px 16px 14px;
  }
  .ebay-comps-ranges {
    display: flex;
    gap: 16px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .ebay-range-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .ebay-range-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--gray-5);
  }
  .ebay-range-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--black);
  }
  .ebay-comps-note {
    font-size: 11px;
    color: var(--gray-5);
    margin-top: 4px;
    line-height: 1.4;
  }
  .ebay-comps-skipped {
    padding: 10px 16px 14px;
    font-size: 13px;
    color: var(--gray-5);
  }

  /* ── Listing tracker box ── */
  .tracker-box {
    background: var(--white);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    margin-bottom: 14px;
    overflow: hidden;
  }
  .tracker-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 0;
  }
  .tracker-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--gray-5);
  }
  .btn-refresh-tracker {
    font-size: 12px;
    font-weight: 600;
    color: var(--brand-dark);
    background: var(--brand-pale);
    border: none;
    border-radius: var(--r-sm);
    padding: 5px 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 150ms ease;
  }
  .btn-refresh-tracker:hover { background: #d6f4f5; }
  .btn-refresh-tracker:disabled { opacity: 0.5; cursor: default; }
  .tracker-body {
    padding: 10px 16px 14px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .tracker-metric {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .tracker-metric-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--gray-5);
  }
  .tracker-metric-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--black);
  }
  .tracker-metric-value.sold { color: var(--brand-dark); }
  .tracker-empty {
    padding: 10px 16px 14px;
    font-size: 13px;
    color: var(--gray-5);
  }
  .tracker-scrape-error {
    padding: 10px 16px 14px;
    font-size: 12px;
    color: var(--error);
  }

  /* ── Actions ── */
  .review-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0 0 8px;
  }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px;
    background: var(--brand);
    color: white;
    border: none;
    border-radius: var(--r-lg);
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background 150ms ease;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
  }

  .btn-primary:hover { background: var(--brand-dark); }

  .btn-secondary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    background: var(--gray-1);
    color: var(--gray-9);
    border: none;
    border-radius: var(--r-lg);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 150ms ease;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
  }

  .btn-secondary:hover { background: var(--gray-2); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: calc(var(--nav-h) + 16px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--black);
    color: white;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: var(--r-pill);
    opacity: 0;
    transition: opacity 250ms ease, transform 250ms ease;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .stats-table { width:100%; border-collapse:collapse; font-size:12px; margin:4px 0 8px; }
  .stats-table th, .stats-table td { text-align:left; padding:6px 6px; border-bottom:1px solid var(--gray-2); vertical-align:top; }
  .stats-table th { font-weight:700; color:var(--gray-7); text-transform:uppercase; font-size:10px; letter-spacing:.4px; }
  .stats-table td:nth-child(2), .stats-table td:nth-child(3) { white-space:nowrap; font-variant-numeric:tabular-nums; }
</style>
{% endblock %}

{% block content %}{% include "review_body.html" %}{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='price_gauge.js') }}"></script>
<script>
const FOLDER = {{ folder | tojson }};
const PHOTOS = {{ (photos or []) | tojson }};

// ── Post on Vinted hand-off: photos, open Vinted, copy the words, mark live ──
function openPostSheet() { document.getElementById('postSheet')?.showModal(); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (_) {
    const area = Object.assign(document.createElement('textarea'), {value: text});
    document.body.appendChild(area); area.select();
    const ok = document.execCommand('copy'); area.remove(); return ok;
  }
}
document.querySelectorAll('.post-row[data-copy]').forEach(row => row.addEventListener('click', async () => {
  const key = row.dataset.copy;
  const text = key === 'title' ? document.getElementById('f-title')?.value
             : key === 'description' ? document.getElementById('f-description')?.value
             : String(document.getElementById('f-price')?.value || '');
  if (await copyText((text || '').trim())) {
    row.classList.add('done'); row.querySelector('b').textContent = 'Copied ✓';
  } else showToast('Copy failed — press and hold to copy');
}));
async function sharePhotos() {
  const btn = document.getElementById('postPhotos');
  btn.disabled = true;
  try {
    const files = await Promise.all(PHOTOS.map(async (name, i) => {
      const blob = await (await fetch(`/items/${encodeURIComponent(FOLDER)}/${encodeURIComponent(name)}`)).blob();
      return new File([blob], `${String(i + 1).padStart(2, '0')}-${name}`, {type: blob.type || 'image/jpeg'});
    }));
    if (navigator.canShare && navigator.canShare({files})) {
      await navigator.share({files});            // pick Vinted or "Save to gallery"
    } else {
      files.forEach(file => {                    // desktop / older phones: download them
        const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(file), download: file.name});
        document.body.appendChild(a); a.click(); a.remove();
      });
    }
    btn.classList.add('done');
  } catch (error) {
    if (error?.name !== 'AbortError') showToast('Could not save photos');
  } finally { btn.disabled = false; }
}
async function markPosted() {
  const btn = document.getElementById('postDone');
  btn.disabled = true;
  const d = new Date(), today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  try {
    const r = await fetch(`/listing/${encodeURIComponent(FOLDER)}/outcome`, {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({status: 'listed', platform: 'Vinted', published_date: today})});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Could not save');
    document.getElementById('postSheet').close();
    const main = document.getElementById('btnPost');
    if (main) main.textContent = 'Live on Vinted ✓';
    showToast('Marked live on Vinted');
  } catch (error) { showToast(error.message); }
  finally { btn.disabled = false; }
}
if (location.hash === '#post') setTimeout(openPostSheet, 300);
const PRICE_RANGE = {{ (listing.price_range or none) | tojson }};
const PRICE_REASONS = {{ (listing.price_adjustments or []) | tojson }};
document.getElementById('priceGauge').innerHTML =
  window.PriceGauge?.html(PRICE_RANGE, {{ listing.price_gbp | tojson }}, PRICE_REASONS) || '';

async function savePrice(price) {
  const resp = await fetch(`/listing/${encodeURIComponent(FOLDER)}`, {
    method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({price_gbp: price}),
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) { showToast('Error: ' + (data.error || 'unknown')); return; }
  showToast('Price saved');
  document.getElementById('f-price').value = data.price_gbp;
  document.getElementById('priceProposal').hidden = true;
  document.getElementById('repriceNudge').hidden = true;
  document.getElementById('priceGauge').innerHTML =
    window.PriceGauge?.html(data.price_range, data.price_gbp, data.price_adjustments) || '';
  document.getElementById('priceGauge').hidden = false;
}
// One dial at a time: the proposal replaces the current dial until it is used or dismissed.
function keepPrice() {
  document.getElementById('priceProposal').hidden = true;
  document.getElementById('priceGauge').hidden = false;
}

async function repriceListing() {
  const btn = document.getElementById('repriceBtn');
  btn.disabled = true; btn.textContent = 'Checking…';
  try {
    const resp = await fetch(`/reprice/${encodeURIComponent(FOLDER)}`, {method: 'POST'});
    const data = await resp.json().catch(() => ({error: 'The server was busy or restarting. Wait a minute, then try again.'}));
    if (!resp.ok) throw new Error(data.error || 'Reprice failed');
    const p = data.price_proposal || {};
    const box = document.getElementById('priceProposal');
    const same = Number(p.price_gbp) === Number(data.price_gbp);
    box.innerHTML = `${window.PriceGauge?.html(p.range, p.price_gbp, p.adjustments) || ''}
      ${same ? '<p style="text-align:center;font-size:13px;color:var(--gray-7);margin:8px 0 0">Matches your current price</p>' : `<div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn-save-field" onclick="savePrice(${Number(p.price_gbp)})">Use £${p.price_gbp}</button>
        <button class="btn-save-field" onclick="keepPrice()">Keep £${data.price_gbp}</button></div>`}`;
    box.hidden = false;
    document.getElementById('repriceNudge').hidden = true;
    document.getElementById('priceGauge').hidden = true;
  } catch (error) {
    showToast(error.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Reprice ↻';
  }
}

function nudgeReprice() {
  document.getElementById('repriceNudge').hidden = false;
}
window.ItemState?.remember(FOLDER, {{ item_revision | tojson }});
let _errorTags = {{ (listing.error_tags or []) | tojson }};

function showToast(msg, duration = 2000) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), duration);
}

async function saveField(field, value) {
  const resp = await fetch(`/listing/${encodeURIComponent(FOLDER)}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ [field]: value }),
  });
  if (resp.ok) {
    showToast("Saved");
    if (["brand", "materials", "item_type", "category", "normalized_size", "gender"].includes(field)) nudgeReprice();
  } else {
    const d = await resp.json().catch(() => ({}));
    showToast("Error: " + (d.error || "unknown"));
  }
}

async function saveMaterials() {
  const raw = document.getElementById("f-materials").value;
  const mats = raw.split(",").map(s => s.trim()).filter(Boolean);
  await saveField("materials", mats);
}

async function saveCondition() {
  const val = document.getElementById("f-condition").value;
  const resp = await fetch(`/listing/${encodeURIComponent(FOLDER)}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ condition_summary: val }),
  });
  if (resp.ok) {
    const data = await resp.json();
    showToast("Saved");
    _updateConditionLineDisplay(data.condition_line);
    nudgeReprice();
  } else {
    const d = await resp.json().catch(() => ({}));
    showToast("Error: " + (d.error || "unknown"));
  }
}

async function saveFlaws() {
  const raw = document.getElementById("f-flaws").value.trim();
  const val = raw || null;
  const resp = await fetch(`/listing/${encodeURIComponent(FOLDER)}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ flaws_note: val }),
  });
  if (resp.ok) {
    const data = await resp.json();
    showToast("Saved");
    _updateConditionLineDisplay(data.condition_line);
    nudgeReprice();
  } else {
    const d = await resp.json().catch(() => ({}));
    showToast("Error: " + (d.error || "unknown"));
  }
}

function _updateConditionLineDisplay(line) {
  const el = document.getElementById("conditionLineDisplay");
  if (el) {
    el.textContent = line || "";
    el.hidden = !line;
  }
}

/* Every detail saves by itself when you leave the field — no Save buttons. */
document.querySelectorAll("[data-field]").forEach(el => {
  el.addEventListener("change", () => {
    const field = el.dataset.field;
    if (field === "materials") return saveMaterials();
    const value = el.value.trim();
    if (field === "gender") filterCategories();
    saveField(field, value === "" ? null : value);
  });
});
document.getElementById("f-price").addEventListener("change", event => {
  const value = parseFloat(event.target.value);
  if (Number.isFinite(value)) savePrice(value);
});
document.querySelectorAll("textarea.rv-title, textarea.rv-desc").forEach(area => {
  const fit = () => { area.style.height = "auto"; area.style.height = area.scrollHeight + "px"; };
  area.addEventListener("input", fit); fit();
});
/* Category list follows Men / Women; the current choice always stays visible. */
function filterCategories() {
  const gender = document.getElementById("f-gender").value;
  const want = gender === "men's" ? "Men" : gender === "women's" ? "Women" : "";
  const select = document.getElementById("f-category");
  select.querySelectorAll("optgroup").forEach(group => {
    const keep = !want || group.dataset.group === want || group.contains(select.selectedOptions[0]);
    group.hidden = !keep; group.disabled = !keep;
  });
}
filterCategories();

async function toggleErrorTag(cat) {
  const idx = _errorTags.indexOf(cat);
  if (idx >= 0) {
    _errorTags.splice(idx, 1);
  } else {
    _errorTags.push(cat);
  }
  // Update button states
  document.querySelectorAll(".error-tag-btn").forEach(btn => {
    const c = btn.id.replace("etag-", "");
    btn.classList.toggle("active", _errorTags.includes(c));
  });
  // Persist
  const resp = await fetch(`/listing/${encodeURIComponent(FOLDER)}/error-tags`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tags: _errorTags }),
  });
  if (resp.ok) {
    showToast(_errorTags.length ? "Tags saved" : "Tags cleared");
  }
}

async function createDraft() {
  const btn = document.getElementById("btnDraft");
  if (!btn) return;
  btn.textContent = "Creating…";
  btn.disabled = true;
  try {
    const resp = await fetch("/create-draft", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ folder: FOLDER }),
    });
    const data = await resp.json();
    if (resp.ok && data.draft_url) {
      btn.outerHTML = `<a class="rv-primary" href="${data.draft_url}" target="_blank" rel="noopener">Open on Vinted</a>`;
    } else {
      btn.textContent = "Create Vinted draft";
      btn.disabled = false;
      if (data.code === "LOW_BRAND_CONFIDENCE") {
        showToast("Low brand confidence — confirm the brand, then retry.", 5000);
      } else if (data.code === "CATEGORY_UNRESOLVED") {
        showToast(`Category '${data.category}' has no Vinted mapping — correct it, then retry.`, 5000);
      } else {
        showToast("Error: " + (data.error || "unknown"), 3000);
      }
    }
  } catch (e) {
    btn.textContent = "Create Vinted draft";
    btn.disabled = false;
  }
}

async function regenListing() {
  const btn = document.querySelector('[onclick="regenListing()"]');
  btn.textContent = "Regenerating…";
  btn.disabled = true;
  try {
    const resp = await fetch(`/regen/${encodeURIComponent(FOLDER)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ updates: {} }),
    });
    if (resp.ok) {
      showToast("Regenerated — reloading…");
      setTimeout(() => location.reload(), 1200);
    } else {
      const d = await resp.json().catch(() => ({}));
      btn.textContent = "Regenerate ↺";
      btn.disabled = false;
      showToast("Error: " + (d.error || "unknown"), 3000);
    }
  } catch (e) {
    btn.textContent = "Regenerate ↺";
    btn.disabled = false;
  }
}

async function markReady() {
  const btn = document.getElementById("btnMarkReady");
  if (!btn) return;
  btn.textContent = "Saving…";
  btn.disabled = true;
  try {
    const resp = await fetch(`/listing/${encodeURIComponent(FOLDER)}/mark-ready`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
    });
    if (resp.ok) {
      showToast("Marked as ready ✓");
      setTimeout(() => { window.location.href = "/drafts"; }, 1000);
    } else {
      btn.textContent = "Mark ready ✓";
      btn.disabled = false;
      showToast("Failed to mark ready");
    }
  } catch {
    btn.textContent = "Mark ready ✓";
    btn.disabled = false;
  }
}

async function resolveGraphicConflict(hasGraphic) {
  const banner = document.getElementById("graphic-conflict");
  const currentCat = document.getElementById("f-category").value;
  // Derive the graphic/plain variant by swapping the last segment
  const graphicCat = currentCat.replace(/>\s*Plain\s*$/, "> Graphic").trimEnd();
  const plainCat   = currentCat.replace(/>\s*Graphic\s*$/, "> Plain").trimEnd();

  if (hasGraphic) {
    // Has a print → switch category to Graphic, keep pattern as Graphic
    await saveField("category", graphicCat);
    await saveField("style", "Graphic");
    document.getElementById("f-category").value = graphicCat;
    showToast("Category changed to Print/Graphic");
  } else {
    // No print → keep Plain category, correct pattern to Plain
    await saveField("pattern", "Plain");
    await saveField("style", "Plain");
    showToast("Pattern corrected to Plain");
  }
  banner.remove();
}

async function fetchEbayComps() {
  const btn = document.getElementById("btnFetchComps");
  if (!btn) return;
  btn.textContent = "Fetching…";
  btn.disabled = true;
  try {
    const resp = await fetch(`/api/listing/${encodeURIComponent(FOLDER)}/fetch-ebay-comps`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
    });
    const data = await resp.json();
    if (!resp.ok) {
      showToast("Error: " + (data.error || "unknown"), 3000);
      btn.textContent = "Fetch";
      btn.disabled = false;
      return;
    }
    _renderEbayComps(data);
    btn.textContent = "Refresh";
    btn.disabled = false;
  } catch (e) {
    showToast("Fetch failed", 3000);
    btn.textContent = "Fetch";
    btn.disabled = false;
  }
}

async function refreshTracker() {
  const btn = document.getElementById("btnRefreshTracker");
  const content = document.getElementById("trackerContent");
  if (!btn || !content) return;
  btn.textContent = "Scraping…";
  btn.disabled = true;
  try {
    const resp = await fetch(`/tracker/refresh/${encodeURIComponent(FOLDER)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
    });
    const data = await resp.json();
    _renderTracker(data);
    btn.textContent = "Refresh";
    btn.disabled = false;
  } catch (e) {
    content.innerHTML = '<div class="tracker-scrape-error">Scrape failed — check connection</div>';
    btn.textContent = "Refresh";
    btn.disabled = false;
  }
}

function _renderTracker(data) {
  const content = document.getElementById("trackerContent");
  if (!content) return;

  if (data.scrape_error) {
    content.innerHTML = `<div class="tracker-scrape-error">${data.scrape_error}</div>`;
    return;
  }

  const views = data.views != null ? data.views : "—";
  const favs = data.favourites != null ? data.favourites : "—";
  const price = data.price_gbp != null ? `£${data.price_gbp}` : (data.current_price != null ? `£${data.current_price}` : "—");
  const status = data.status_scraped || data.status || "active";
  const soldClass = status === "sold" ? " sold" : "";
  const daysLive = data.days_live != null ? `${data.days_live}d` : "—";
  const scraped = data.scraped_at || data.last_scraped_at || "";
  const scrapedShort = scraped ? scraped.slice(0, 16).replace("T", " ") : "";

  content.innerHTML = `
    <div class="tracker-body">
      <div class="tracker-metric">
        <span class="tracker-metric-label">Status</span>
        <span class="tracker-metric-value${soldClass}">${status}</span>
      </div>
      <div class="tracker-metric">
        <span class="tracker-metric-label">Views</span>
        <span class="tracker-metric-value">${views}</span>
      </div>
      <div class="tracker-metric">
        <span class="tracker-metric-label">Favourites</span>
        <span class="tracker-metric-value">${favs}</span>
      </div>
      <div class="tracker-metric">
        <span class="tracker-metric-label">Price</span>
        <span class="tracker-metric-value">${price}</span>
      </div>
      <div class="tracker-metric">
        <span class="tracker-metric-label">Days live</span>
        <span class="tracker-metric-value">${daysLive}</span>
      </div>
    </div>
    ${scrapedShort ? `<div style="padding:0 16px 10px;font-size:11px;color:var(--gray-5)">Scraped ${scrapedShort} UTC</div>` : ""}
  `;
}

// Auto-load tracker status on page load if draft exists
(async function initTracker() {
  const box = document.getElementById("trackerBox");
  if (!box) return;
  try {
    const resp = await fetch(`/tracker/status/${encodeURIComponent(FOLDER)}`);
    const data = await resp.json();
    if (data.tracked && (data.views != null || data.last_scraped_at)) {
      _renderTracker(data);
    } else {
      document.getElementById("trackerContent").innerHTML =
        '<div class="tracker-empty">No data yet — tap Refresh to scrape Vinted.</div>';
    }
  } catch {
    document.getElementById("trackerContent").innerHTML =
      '<div class="tracker-empty">No data yet — tap Refresh to scrape Vinted.</div>';
  }
})();

function _renderEbayComps(data) {
  const content = document.getElementById("ebayCompsContent");
  if (!content) return;

  if (data.ebay_comps_skipped) {
    content.innerHTML = `<div class="ebay-comps-skipped">${data.ebay_comps_skipped.replace(/_/g, " ")}</div>`;
    return;
  }

  const r = data.ebay_suggested_range || {};
  const v = data.ebay_vinted_range || {};
  const count = data.ebay_comps_count || "";
  const note = data.ebay_comps_note || "";

  content.innerHTML = `
    <div class="ebay-comps-body">
      <div class="ebay-comps-ranges">
        <div class="ebay-range-block">
          <span class="ebay-range-label">eBay active (used)</span>
          <span class="ebay-range-value">£${r.low || "?"}–£${r.high || "?"}</span>
        </div>
        ${v.low ? `<div class="ebay-range-block">
          <span class="ebay-range-label">Suggested Vinted</span>
          <span class="ebay-range-value" style="color:var(--brand-dark)">£${v.low}–£${v.high}</span>
        </div>` : ""}
        ${count ? `<div class="ebay-range-block">
          <span class="ebay-range-label">Listings used</span>
          <span class="ebay-range-value" style="font-size:14px;color:var(--gray-7)">${count}</span>
        </div>` : ""}
      </div>
      ${note ? `<div class="ebay-comps-note">${note}</div>` : ""}
    </div>
  `;
}
</script>
